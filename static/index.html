<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>dashboard</title>

    <style>
@font-face {
  font-family: Quicksand;
  src: url(/quicksand.ttf);
}

html {
  background: #11151f;
  background: url(/nasa_moon.jpg);
  background-size: cover;
  min-height: 100%;
}

html, body  {
  color: #e6e6e6;
  font-family: Quicksand, monospace;
  font-weight: bold;
  font-size: 1rem;
  margin: 0;
  padding: 1em;
}

h1 {
  text-align: center;
}

a  {
  color: #f2f2ff;
}

ul  {
  display: grid;
  margin: 0;
  padding: 0;
}

li  {
  display:block;
  width: 100%;
  border: 1px solid aliceblue;
  border-radius: 0.5em;
  margin-bottom: 1em;
  position: relative;
  box-sizing: border-box;
  min-height: 3rem;
  align-content: center;
  padding-left: 3rem;
  padding-right: 0;
  background: #191c1f99;
  transition: background 0.5s;
}
li:hover {
  background: #303438cc;
}


li::before  {
  content: "";
  position: absolute;
  left: 0.9rem;
  top: 50%;
  width: 0.75rem;
  aspect-ratio: 1;
  border-radius: 50%;
  transform: translateY(-50%);
}

li.good::before  {
  background: #52c41a;
}

li.bad::before  {
  background: #ff3b4d;
}

li.unknown::before  {
  background: #777777;
}

@media (width > 600px) {
  body {
    width: 40%;
    margin-left: 30%;
    margin-right: 30%;
  }
}
    </style>
  </head>
  <body>
    <h1>dashboard</h1>
    <ul></ul>
    <script>
      const ul = document.querySelector("ul");

      const update = async () => {
        const res = await fetch("/data");
        console.log(res);
        const data = await res.json();
        console.log(data);

        let newHTML = "";
        for (const p of data) {
          let className = "unknown";
          if (200 <= p.status && p.status < 400) {
            className = "good";
          } else if (p.status != 0) {
            className = "bad";
          }
          newHTML += `<li class="${className}"><a href="${p.url}">${p.name}</a></li>`
        }
        ul.innerHTML = newHTML;

        setTimeout(() => requestAnimationFrame(update), 10000);
      }
      update();
    </script>
  </body>
</html>
